    <p>KeyCode: </p>
    <script>
        let Headline = document.querySelector("h1")

        Headline.addEventListener("mouseover", function() {
            Headline.textContent = "Dont push my buttons"
        })

        let Body = document.querySelector("body")
        Body.addEventListener("keydown", Makesure)
        Body.addEventListener("keydown", KeyCode)

        let Clicked = document.querySelector("p")

        function Makesure(e) {
            if (e.keyCode == 82) {
                Body.style.backgroundColor = "red"
            }
            else if (e.keyCode == 71) {
                Body.style.backgroundColor = "lime"
            }
            else if (e.keyCode == 66) {
                Body.style.backgroundColor = "blue"
            }
        }

        function KeyCode(e) {
            Clicked.innerHTML = "keyCode: " + e.keyCode
        }
